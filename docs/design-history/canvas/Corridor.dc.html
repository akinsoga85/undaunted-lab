<script type="text/x-dc" data-dc-script data-props='{"tourSeconds":{"editor":"range","min":2,"max":10,"step":0.5,"default":4.2,"unit":"s"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.POS = { scamfendr: [795, 265], vervet: [895, 355], ganusii: [825, 852], notiscare: [615, 785], nestlo: [245, 310], hq: [485, 535], soon1: [155, 380], soon2: [775, 380] };
    this.TOUR = ['scamfendr', 'vervet', 'ganusii', 'notiscare', 'nestlo'];
    this.state = { stop: -1, hover: null, paused: false, menu: false, target: 'hq', angle: -25 };
  }
  componentDidMount() {
    let reduce = false;
    try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
    if (reduce) { this.setState({ paused: true, stop: 0 }); this.aim('scamfendr'); return; }
    this.kick = setTimeout(() => this.next(), 900);
    this.timer = setInterval(() => this.next(), (this.props.tourSeconds ?? 4.2) * 1000);
  }
  componentWillUnmount() { clearInterval(this.timer); clearTimeout(this.kick); }
  next() {
    if (this.state.hover || this.state.paused) return;
    const s = (this.state.stop + 1) % this.TOUR.length;
    this.setState({ stop: s });
    this.aim(this.TOUR[s]);
  }
  aim(id) {
    const a = this.POS[this.state.target], b = this.POS[id];
    let angle = this.state.angle;
    const dx = b[0] - a[0], dy = b[1] - a[1];
    if (Math.abs(dx) + Math.abs(dy) > 4) {
      const sx = 0.7071 * (dx + dy), sy = 0.3536 * (dy - dx);
      angle = Math.round(Math.atan2(sy, sx) * 180 / Math.PI);
      let diff = ((angle - this.state.angle) % 360 + 540) % 360 - 180;
      angle = this.state.angle + diff;
    }
    this.setState({ target: id, angle: angle });
  }
  renderVals() {
    const INFO = {
      scamfendr: { name: 'Scamfendr', line: 'Check a business before you pay.', place: 'UK', status: 'Live', color: '#2E86C1', url: 'https://scamfendr.uk', cta: 'Visit ↗' },
      vervet: { name: 'Vervet', line: 'Prove you were watching. Compliance for cross-border payments.', place: 'UK ⇄ Nigeria', status: 'In the lab', color: '#F6C343', url: 'https://vervethq.com', cta: 'Peek ↗' },
      ganusii: { name: 'Ganusii', line: 'Lagos commutes, shared.', place: 'Lagos', status: 'Pilot', color: '#1E4D3A', url: 'https://ganusii.com', cta: 'Visit ↗' },
      notiscare: { name: 'NotisCare', line: 'Know before the family calls.', place: 'Nigeria', status: 'Live', color: '#24304F', url: 'https://notis.care', cta: 'Visit ↗' },
      nestlo: { name: 'Nestlo', line: 'Your Alberta settlement plan, built for you.', place: 'Canada', status: 'Live', color: '#1F6F6B', url: 'https://nestlo.ca', cta: 'Visit ↗' },
      hq: { name: 'Undaunted Lab', line: 'Where the paper planes take off.', place: 'HQ', status: 'Est. 2025', color: '#F47B5A', url: '#story', cta: 'Our story' },
      soon1: { name: 'Coming soon', line: 'Something new is being built here.', place: 'Canada', status: 'Under wraps', color: '#FFE3D8', url: '#notify', cta: 'Notify me' },
      soon2: { name: 'Coming soon', line: 'Something new is being built here.', place: 'UK', status: 'Under wraps', color: '#FFE3D8', url: '#notify', cta: 'Notify me' }
    };
    const ids = Object.keys(this.POS);
    const target = this.state.target, hover = this.state.hover;
    const active = hover || target;
    const h = {}, lift = {}, ring = {};
    ids.forEach((id) => {
      h[id] = () => { this.setState({ hover: id }); this.aim(id); };
      lift[id] = hover === id ? 16 : 0;
      ring[id] = active === id ? 1 : 0;
    });
    const p = this.POS[target];
    const dots = this.TOUR.map((id, i) => ({
      label: 'Fly to ' + INFO[id].name,
      pressed: target === id ? 'true' : 'false',
      w: target === id ? '22px' : '10px',
      bg: target === id ? '#F47B5A' : '#FFFFFF',
      pick: () => { this.setState({ stop: i }); this.aim(id); }
    }));
    const menuItems = this.TOUR.map((id) => ({ ...INFO[id], hover: () => this.aim(id) }));
    return {
      h, lift, ring, dots, menuItems,
      cur: INFO[active],
      unhover: () => this.setState({ hover: null }),
      planeT: 'translate3d(' + p[0] + 'px, ' + p[1] + 'px, 215px)',
      shadowT: 'translate3d(' + p[0] + 'px, ' + p[1] + 'px, 30px)',
      planeA: this.state.angle,
      menu: this.state.menu,
      menuOpen: this.state.menu ? 'true' : 'false',
      caret: this.state.menu ? '▴' : '▾',
      toggleMenu: () => this.setState({ menu: !this.state.menu }),
      pauseLabel: this.state.paused ? 'Play tour' : 'Pause tour',
      togglePause: () => this.setState({ paused: !this.state.paused })
    };
  }
}
